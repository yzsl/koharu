name: Build Koharu for Colab

# 允许手动点击按钮触发编译
on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-22.04 # 核心：强制使用与 Colab 完全一致的系统环境

    steps:
    - name: 1. 拉取源代码
      uses: actions/checkout@v4

    - name: 2. 安装 Ubuntu 22.04 系统级编译依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake llvm clang pkg-config libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libvulkan-dev

    - name: 3. 配置 Rust 环境
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: 4. 配置 Bun 环境
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: 5. 安装前端依赖
      run: bun install

    - name: 6. 启动 Tauri 核心编译 (耗时较长，请耐心等待)
      run: bun tauri build

    - name: 7. 提取成品并打包下载
      uses: actions/upload-artifact@v4
      with:
        name: koharu_custom # 你最终下载的压缩包名称
        # 提取编译好的绿色二进制文件
        path: src-tauri/target/release/koharu 
        retention-days: 7 # 在服务器上保留 7 天
