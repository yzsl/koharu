name: Build Koharu for Colab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. 拉取源代码
      uses: actions/checkout@v4
      with:
        fetch-tags: true  # 只把轻量级的版本标签全拉下来，不拉取深层历史代码

    - name: 1.5 强力清理磁盘空间 (为 CUDA 腾出几十GB空间)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true    # 删掉几GB的安卓开发包
        dotnet: true     # 删掉没用的微软.NET环境
        haskell: true    # 删掉不用的语言包
        large-packages: false
        docker-images: true # 删掉预装的笨重Docker镜像
        swap-storage: false

    - name: 2. 安装 Ubuntu 基础编译依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake llvm clang pkg-config libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libvulkan-dev

    - name: 3. 安装最新版 CUDA Toolkit 12.2 (解决 fp8 问题)
      uses: Jimver/cuda-toolkit@v0.2.18
      id: cuda-toolkit
      with:
        cuda: '12.2.0'

    - name: 4. 配置 Rust 环境
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: 5. 配置 Bun 环境
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: 6. 安装前端依赖
      run: bun install

    - name: 7. 启动 Tauri 核心编译 (专属适配 Colab T4 显卡跳过安装包打包与签名) 
      env:
        CUDA_COMPUTE_CAP: 75 
      run: bun tauri build --no-bundle

    - name: 8. 提取成品并打包下载
      uses: actions/upload-artifact@v4
      with:
        name: koharu_custom
        path: target/release/koharu 
        retention-days: 7
